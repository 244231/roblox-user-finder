<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox User Finder 2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#111827);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}
.card{
width:100%;
max-width:420px;
background:#1f2937;
border-radius:24px;
padding:28px;
box-shadow:0 20px 50px rgba(0,0,0,.45);
text-align:center;
}
.logo{font-size:60px;margin-bottom:10px}
input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin:15px 0;
font-size:16px;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.25s;
}
button:hover{transform:scale(1.03)}
.profile{
display:none;
margin-top:25px;
padding:20px;
background:#111827;
border-radius:18px;
}
.avatar{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #3b82f6;
margin-bottom:15px;
}
.tag{
margin-top:20px;
opacity:.7;
font-size:13px;
}
</style>
</head>
<body>
<div class="card">
<div class="logo">🎮</div>
<h1>Roblox User Finder</h1>
<input id="username" placeholder="Enter Roblox username">
<button onclick="searchUser()">Search</button>

<div class="profile" id="profile">
<img class="avatar" src="https://placehold.co/120x120/png" alt="">
<h2 id="display">Display Name</h2>
<p><b>Username:</b> <span id="user"></span></p>
<p><b>User ID:</b> Coming Soon</p>
<p><b>Status:</b> Ready for Roblox API</p>
</div>

<div class="tag">Version 2.0 Starter</div>
</div>

<script>
function searchUser(){
const u=document.getElementById("username").value.trim();
if(!u){alert("Enter a username");return;}
document.getElementById("profile").style.display="block";
document.getElementById("display").textContent=u;
document.getElementById("user").textContent=u;
}
</script>
</body>
</html>
