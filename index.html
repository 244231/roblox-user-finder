<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox User Finder</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:350px;
    background:#1f2937;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
    color:white;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    color:white;
}
</style>
</head>

<body>

<div class="box">

<h1>Roblox User Finder</h1>

<input id="username" placeholder="Enter Username">

<button onclick="searchUser()">Search</button>

<div id="result">

<h3>Profile</h3>

<p><b>Username:</b> -</p>

<p><b>Display Name:</b> -</p>

<p><b>User ID:</b> -</p>

</div>


</div>

<script>
function searchUser(){

const username =
document.getElementById("username").value;

document.getElementById("result").innerHTML = `
<div id="result">

<img
id="avatar"
src="https://placehold.co/120x120"
style="width:120px;border-radius:50%;margin-bottom:15px;">

<h3>Profile</h3>

<p><b>Username:</b> -</p>

<p><b>Display Name:</b> -</p>

<p><b>User ID:</b> -</p>

<p><b>Status:</b> Waiting...</p>

</div>

<p><b>Username:</b> ${username}</p>

<p><b>Display Name:</b> Example Display Name</p>

<p><b>User ID:</b> 123456789</p>
`;

}
</script>

</body>
</html>
